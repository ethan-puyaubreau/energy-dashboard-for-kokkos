[package]
name = "energy-for-kokkos"
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
authors = ["Ethan Puyaubreau <ethan.puyaubreau@gmail.com>"]
description = "HPC energy analysis and profiling tool for Kokkos applications"
license = "Apache-2.0"
repository = "https://github.com/ethan-puyaubreau/energy-for-kokkos"
readme = "README.md"
keywords = ["kokkos", "energy", "profiling", "hpc", "gpu"]
categories = ["command-line-utilities", "development-tools::profiling", "science"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
comfy-table = "7.1"
anyhow = "1.0"
tempfile = "3.10"
