[package]
name = "kokkos-energy"
version = "0.1.0"
edition = "2021"
authors = ["Ethan Puyaubreau <ethan.puyaubreau@gmail.com>"]
description = "HPC energy analysis and profiling tool for Kokkos applications"
license = "Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
comfy-table = "7.1"
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.10"
