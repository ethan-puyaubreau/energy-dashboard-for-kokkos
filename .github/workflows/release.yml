name: Release

on:
  push:
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  linux:
    name: Package Linux x86_64
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Resolve version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Check tag matches crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$VERSION" = "$GITHUB_REF_NAME"

      - name: Run tests
        run: cargo test --locked

      - name: Build static binary
        run: cargo build --release --locked --target "$TARGET"

      - name: Check binary is static
        run: |
          binary="target/$TARGET/release/energy-dashboard-for-kokkos"
          file "$binary"
          if readelf -d "$binary" | grep -q NEEDED; then
            echo "binary links shared libraries" && exit 1
          fi
          if readelf -l "$binary" | grep -q "program interpreter"; then
            echo "binary requires a dynamic loader" && exit 1
          fi
          "$binary" --version

      - name: Package archive
        run: |
          name="energy-dashboard-for-kokkos-v$VERSION-$TARGET"
          mkdir "$name"
          cp "target/$TARGET/release/energy-dashboard-for-kokkos" "$name/"
          cp README.md DATA_SPEC.md CHANGELOG.md LICENSE THIRD_PARTY_NOTICES.md "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Extract release notes
        run: |
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            index($0, "## [") == 1 { found = 0 }
            found
          ' CHANGELOG.md > release_notes.md
          test -s release_notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" energy-dashboard-for-kokkos-v*.tar.gz* \
            --title "energy-dashboard-for-kokkos $GITHUB_REF_NAME" \
            --notes-file release_notes.md
