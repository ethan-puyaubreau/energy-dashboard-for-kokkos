name: Rust CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check code formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --verbose

      - name: Check documentation
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Build release binary
        run: cargo build --release

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Measure coverage
        run: cargo llvm-cov --locked --summary-only | tee coverage.txt

      - name: Publish summary
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat coverage.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  connector:
    name: Connector end to end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build the connector against the NVML stub
        run: |
          cmake -S connector -B build-connector -DENERGY_CONNECTOR_NVML_STUB=ON
          cmake --build build-connector

      - name: Trace a simulated Kokkos run
        run: KOKKOS_TOOLS_OUTPUT_PATH=trace build-connector/connector_smoke build-connector/libenergy_dashboard_connector.so

      - name: Analyze the trace
        run: |
          cargo run --release -- analyze trace | tee report.txt
          # The stub reports a constant 100 W, so both blocks must average 100 W.
          grep -E 'Solve +┆ USER_REGION +┆ 1 .*┆ 100\.0 ' report.txt
          grep -E 'Kernel +┆ PARALLEL_FOR +┆ 1 .*┆ 100\.0 ' report.txt

  tutorial:
    name: Tutorial
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run the tutorial commands
        run: |
          cargo build --release
          export PATH="$PWD/target/release:$PATH"
          while IFS= read -r cmd; do
            echo "+ $cmd"
            $cmd >> output.txt
          done < <(grep '^energy-dashboard-for-kokkos ' docs/tutorial.md)
          test -s trace.json
          test -s report.html

      - name: Check the figures quoted in the tutorial
        run: |
          # Turn the table rows of the output into Markdown rows: | a | b | ... |
          sed -E 's/ *(│|┆) */ | /g; s/^ //; s/ $//' output.txt > rows.txt
          missing=0
          while IFS= read -r line; do
            grep -qFx -- "$line" rows.txt output.txt || { echo "Not in the output: $line"; missing=1; }
          done < <(awk -F'|' 'NF == 10 && $2 !~ /Block|^-+$/' docs/tutorial.md
                   grep -E '^  (Note|GPU 0):' docs/tutorial.md)
          exit $missing

  msrv:
    name: Minimum Rust Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@1.88

      - name: Build with locked dependencies
        run: cargo build --locked
