name: Rust CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check code formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --verbose

      - name: Check documentation
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Build release binary
        run: cargo build --release

  connector:
    name: Connector end to end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The connector is maintained in the kokkos-tools fork. Bump the pinned commit
      # to test the analysis against a newer connector.
      - name: Checkout the connector
        uses: actions/checkout@v4
        with:
          repository: ethan-puyaubreau/kokkos-tools
          ref: 6a1e8b81458dd87a3df9338735dd62239b6bf4af # feat/v1-energy-profiler
          path: kokkos-tools
          sparse-checkout: profiling/energy-profiler

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build the connector against the NVML stub
        run: |
          cmake -S kokkos-tools/profiling/energy-profiler -B build-connector -DKP_ENERGY_PROFILER_NVML_STUB=ON
          cmake --build build-connector

      - name: Trace a simulated Kokkos run
        run: KOKKOS_TOOLS_OUTPUT_PATH=trace build-connector/kp_energy_profiler_smoke build-connector/libkp_energy_profiler.so

      - name: Analyze the trace
        run: |
          cargo run --release -- analyze trace | tee report.txt
          # The stub reports a constant 100 W, so both blocks must average 100 W.
          grep -E 'Solve +┆ USER_REGION +┆ 1 .*┆ 100\.0 ' report.txt
          grep -E 'Kernel +┆ PARALLEL_FOR +┆ 1 .*┆ 100\.0 ' report.txt

  msrv:
    name: Minimum Rust Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@1.88

      - name: Build with locked dependencies
        run: cargo build --locked
