name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r requirements.txt

      - name: Lint Python scripts
        run: |
          flake8 scripts/ --max-line-length=120 --exclude=.venv,__pycache__

      - name: Validate Docker Compose configuration
        run: |
          docker compose --env-file .env.example config

      - name: Check shell scripts syntax
        run: |
          bash -n setup.sh
          bash -n remove.sh
          bash -n input/clean.sh
          bash -n input/generic_script.sh
          bash -n benchmark/build.sh
          bash -n benchmark/run.sh
