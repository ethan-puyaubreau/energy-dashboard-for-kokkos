---
services:
  postgres_db:
    image: postgres:15-alpine
    container_name: energy_analysis_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-energy_analysis}
      POSTGRES_USER: ${POSTGRES_USER:-grafana_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-super_secret_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - ./data:/csv_data
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grafana_user} -d ${POSTGRES_DB:-energy_analysis}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
    depends_on:
      postgres_db:
        condition: service_healthy

volumes:
  postgres_data:
  grafana-data:
