apiVersion: 1

datasources:
  - name: PostgreSQL-Energy
    type: grafana-postgresql-datasource
    uid: bepxmpopbv668b
    access: proxy
    url: postgres_db:5432
    database: ${POSTGRES_DB:energy_analysis}
    user: ${POSTGRES_USER:grafana_user}
    secureJsonData:
      password: ${POSTGRES_PASSWORD:super_secret_password}
    jsonData:
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
    isDefault: true
    editable: false
